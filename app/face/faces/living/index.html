  body.portrait #hud{left:3vw;right:3vw;top:19vh;width:auto;z-index:3000;display:block;font-size:2.6vw;letter-spacing:.06em;
       background:rgba(3,8,14,.55);border:1px solid rgba(120,160,220,.22);border-radius:12px;padding:1.6vw 2.4vw;opacity:.95}
  body.portrait #hud .top{display:flex;align-items:center;gap:2.4vw}
  body.portrait #hud .lvl{font-size:5vw;white-space:nowrap}
  body.portrait #hud .m{display:flex;flex-direction:column;align-items:stretch;gap:.8vw;flex:1;min-width:0}
  body.portrait #hud .m .bar{display:block;width:100%;height:1.2vw;flex:none}
  body.portrait #hud .tag{opacity:.75;white-space:nowrap}
  body.portrait #hud .tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:1.6vw;margin-top:2vw}
  body.portrait #hud .t{text-align:center;border:1px solid rgba(120,160,220,.15);border-radius:8px;padding:1.2vw 0;background:rgba(255,255,255,.03)}
  body.portrait #hud .t b{display:block;font-size:5.4vw;line-height:1.1;color:#e8f0ff}
  body.portrait #hud .t span{font-size:2.2vw;opacity:.7}

  }

        letter-spacing:.45em;color:#8aa0b8;opacity:.7;pointer-events:none;transition:color .8s}

/* =============== FRAME =============== */
function frame(dt) {

  const k = Math.min(1, dt / 380);
  for (const key of KEYS) ctl[key] = lerp(ctl[key], target[key], k);
  // gaze: follow the active prop (the face watches its own animations)
  const active = mode === "error" ? "skull" : mode === "allow" ? null : mode === "listening" ? "ear" : (now < bulbUntil ? "bulb" : prop);
  if (active && STATION[active] && active !== "monocle") { const s = STATION[active]; gazeT = [clamp(s[0], -1, 1), clamp(s[1] + .1, -1, 1)]; }
  else if (!active && Math.random() < .01) gazeT = [(Math.random() - .5) * 1.2, (Math.random() - .5) * .6];
  if (mode === "allow") gazeT = [0, 0];
  if (exprLook === "up") gazeT = [Math.sin(t * 3) * .8, -1];
  if (exprLook === "side") gazeT = [1, 0];
  gaze[0] = lerp(gaze[0], gazeT[0], Math.min(1, dt / 140)); gaze[1] = lerp(gaze[1], gazeT[1], Math.min(1, dt / 140));
  ctl.turn = lerp(ctl.turn, target.turn + gaze[0] * .25, k);

  for (let i = 0; i < 3; i++) col[i] = lerp(col[i], c2[i], Math.min(1, dt / 600));
  const NAMES = { hands:"WORKING THE PC", laptop:"TYPING", globe:"BROWSING", magnifier:"SEARCHING", gears:"BUILDING", phone:"ON THE PHONE",
    consult:"CONSULTING", monocle:"RESEARCHING", code:"WRITING CODE", dancers:"MESSAGING", cinema:"WATCHING", disco:"MUSIC", stethoscope:"SELF-CHECK",
    book:"LESSONS", quill:"TAKING NOTES", seal:"SAMASA", mask:"SWITCHING BRAIN", ink:"CHANGING VOICE", doc:"READING YOUR FILE", frame:"LOOKING AT THE SCREEN", iris:"CAMERA" };
  word.textContent = mode === "thinking" ? (NAMES[prop] || "THINKING") : ({ idle: exprName === "dozing" ? "DOZING" : "IDLE", listening: "LISTENING",
    speaking: "SPEAKING", allow: "WAITING FOR YOUR ALLOW", error: "SOMETHING WENT WRONG", offline: "OFFLINE" }[mode] || "");

  if (mode === "listening") drawProp("ear", 1);
  if (prop && mode !== "error" && mode !== "offline") drawProp(prop, 1);
  if (now < bulbUntil) drawProp("bulb", 1);

    const f = p.life / p.max; p.x += p.vx * dt / 1000; p.y += p.vy * dt / 1000; p.rot += dt / 500;
    if (p.kind === "letter") { p.vx += Math.sin(t * 4 + p.rot) * 2; }   // letters flutter like birds

      + mb("ENERGY", v.energy, v.energy > 40 ? "#39c5cf" : "#f0883e") + `</div>`
      + `<div class="tiles">` + t(v.streak, "🔥 STREAK", "fire") + t(v.best_streak, "BEST") + t(v.jobs_today, "JOBS")
      + t(v.steps_today, "STEPS") + t(v.fails_today, "SLIPS", v.fails_today ? "bad" : "") + `</div>`;
  } else
  hud.innerHTML = `<div class="lvl">LV ${v.level}</div>` + bar("XP", 100 * v.xp_in / v.xp_need, "#e3b341")
    + bar("MORALE", v.morale, v.morale > 60 ? "#3fb950" : v.morale > 40 ? "#e3b341" : "#f85149")
    + bar("ENERGY", v.energy, v.energy > 40 ? "#39c5cf" : "#f0883e")
    + `<div class="row sub">STREAK ${v.streak} · BEST ${v.best_streak}</div><div class="row sub">TODAY ${v.jobs_today} jobs · ${v.steps_today} steps · ${v.fails_today} slips</div>`;
  const busy = B && B.busy_s && !["done","failed","lessons_done"].includes(B.phase) && Date.now() / 1000 - B.t < 15;
  stepEl.textContent = busy ? `${(B.label || "").toUpperCase()} · STEP ${B.step}${B.retries ? " · RETRY " + B.retries : ""}${B.fails_row ? " · " + B.fails_row + " FAILED" : ""} · ${B.busy_s}s` : "";
}
const ICON = { start:"▶", step:"•", step_ok:"✓", failed_step:"✗", recovered:"↺", allow:"✋", allowed:"✔", denied:"⛔", error:"☠", done:"★", failed:"✗", lessons_done:"🎓" };
async function openJournal() {
  if (jr.style.display === "block") { jr.style.display = "none"; return; }
  jr.style.display = "block"; jr.innerHTML = "<h3>JOURNAL</h3>Loading…";
  try {
    const d = await (await fetch("/api/behaviour", { cache: "no-store" })).json(), v = d.vitals;
    const rows = d.events.slice().reverse().map(e => { const tm = new Date(e.t * 1000).toTimeString().slice(0, 5);
      const cls = /fail|error|denied/.test(e.phase) ? "bad" : /done|ok|recovered|allowed/.test(e.phase) ? "ok" : "";
      const what = e.detail || e.result || e.error || e.said || "";
      return `<div class="ev ${cls}"><b>${tm} ${ICON[e.phase] || "•"} ${e.label}</b> · ${e.mood}${e.level_up ? " · LEVEL " + e.level_up + "!" : ""}<br><span style="opacity:.7">${String(what).replace(/</g, "&lt;").slice(0, 140)}</span></div>`; }).join("");
    jr.innerHTML = `<h3>JOURNAL · LV ${v.level} · ${v.xp} XP</h3>` + (rows || "Nothing yet today.");
  } catch (e) { jr.innerHTML = "<h3>JOURNAL</h3>Jarvis isn't reachable."; }
}
hud.addEventListener("click", openJournal);
jr.addEventListener("click", () => { jr.style.display = "none"; });
(async () => { if (Q.get("shot")) return; try { const d = await (await fetch("/api/behaviour", { cache: "no-store" })).json(); window.JV_VITALS = d.vitals; } catch (e) {} })();

if (AV.shot) AV.shotRun(frame);
else { let last = performance.now(); const loop = n => { frame(Math.min(100, n - last)); last = n; requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
</script>
</body>
